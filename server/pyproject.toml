[project]
name = "a2a-workbench"
version = "0.1.0"
description = "Debug, test and conformance-check any A2A agent: web UI, CLI and MCP server built on the official a2a-sdk"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Keshav Mittal", email = "mittalkeshav41@gmail.com" }]
dependencies = [
  "a2a-sdk[grpc,http-server,signing]>=1.2.2,<1.3",
  "cryptography>=43",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.20",
  "typer>=0.15",
  "httpx>=0.28.1",
  "mcp>=2.3,<3",
  "anthropic>=1.12.1",
  "openai>=3.26.1",
  "google-genai>=2.29.0",
  "alembic>=1.14",
]

[project.scripts]
a2a-workbench = "a2a_workbench.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "respx>=0.22", "ruff>=0.9", "mypy>=1.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a2a_workbench"]
artifacts = ["a2a_workbench/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"a2a_workbench/core/integrate/templates.py" = ["E501"]  # generated-code templates are kept verbatim
"a2a_workbench/core/health/report.py" = ["E501"]  # inline CSS and HTML template
