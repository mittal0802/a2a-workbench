name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  server-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      A2AW_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:pw@localhost:5432/postgres
      A2AW_TEST_ALL_ON_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13 --extra postgres
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: [server, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd server && uv sync --python 3.13
      - run: scripts/build.sh --no-wheel
      - run: cd web && pnpm exec playwright install --with-deps chromium
      - run: cd web && pnpm e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t a2a-workbench:ci .
      - name: Smoke-test the image
        run: |
          docker volume create a2aw-data
          docker run -d --name a2aw -p 8484:8484 -v a2aw-data:/data a2a-workbench:ci
          for i in $(seq 1 30); do curl -fs localhost:8484/api/health && break; sleep 1; done
          curl -fs localhost:8484/api/health | grep -q '"version":"1.0.0"'
          curl -fs localhost:8484/ | grep -q '<div id="root">'
          test "$(docker exec a2aw id -u)" = 10001
          docker exec a2aw a2a-workbench db current --json | grep -q '"revision": "0001"'
          docker exec a2aw python -c "import asyncpg"
          for i in $(seq 1 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' a2aw)" = healthy ] && break; sleep 1; done
          test "$(docker inspect -f '{{.State.Health.Status}}' a2aw)" = healthy
      - name: Smoke-test the compose example on Postgres
        run: |
          docker rm -f a2aw
          echo "POSTGRES_PASSWORD=ci-only" > .env
          docker compose up -d --wait --build
          curl -fs localhost:8484/api/health
          docker compose exec -T workbench a2a-workbench db current --json | grep -q '"database": "postgresql+asyncpg://workbench:\*\*\*@postgres'
          docker compose down -v
